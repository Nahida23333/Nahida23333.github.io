<svg viewBox="0 0 680 520" width="100%" xmlns="http://www.w3.org/2000/svg">
  <title>qPCR 扩增曲线与 Ct 值示意图</title>
  <desc>三条不同起始模板量的S型扩增曲线；荧光信号首次超过阈值线的循环数即Ct值，起始模板越多Ct越小。</desc>
  <rect x="0" y="0" width="680" height="520" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- phase bands -->
  <rect x="70" y="60" width="190" height="360" fill="#F1F5F9"/>
  <rect x="260" y="60" width="220" height="360" fill="#FEF9EC"/>
  <rect x="480" y="60" width="160" height="360" fill="#FDF2F2"/>
  <text x="165" y="82" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500" fill="#64748B">基线期</text>
  <text x="370" y="82" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500" fill="#B45309">指数期（定量区间）</text>
  <text x="560" y="82" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500" fill="#B91C1C">平台期</text>

  <!-- gridlines -->
  <line x1="212.5" y1="60" x2="212.5" y2="420" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="355" y1="60" x2="355" y2="420" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="497.5" y1="60" x2="497.5" y2="420" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="70" y1="150" x2="640" y2="150" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="70" y1="240" x2="640" y2="240" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="70" y1="330" x2="640" y2="330" stroke="#E2E8F0" stroke-width="1"/>

  <!-- axes -->
  <line x1="70" y1="60" x2="70" y2="420" stroke="#334155" stroke-width="1.5"/>
  <line x1="70" y1="420" x2="640" y2="420" stroke="#334155" stroke-width="1.5"/>

  <!-- threshold -->
  <line x1="70" y1="270" x2="640" y2="270" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="632" y="262" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#DC2626">荧光阈值</text>

  <!-- curves -->
  <path d="M70 420 L240 417 C290 414 296 96 380 95 L640 92" fill="none" stroke="#DC2626" stroke-width="2.5"/>
  <path d="M70 420 L330 418 C375 414 382 98 465 96 L640 95" fill="none" stroke="#D97706" stroke-width="2.5"/>
  <path d="M70 420 L415 419 C462 415 468 99 550 97 L640 96" fill="none" stroke="#2563EB" stroke-width="2.5"/>

  <!-- Ct vertical dashed lines -->
  <line x1="297" y1="270" x2="297" y2="420" stroke="#DC2626" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="383" y1="270" x2="383" y2="420" stroke="#D97706" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="469" y1="270" x2="469" y2="420" stroke="#2563EB" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="297" cy="270" r="3.5" fill="#DC2626"/>
  <circle cx="383" cy="270" r="3.5" fill="#D97706"/>
  <circle cx="469" cy="270" r="3.5" fill="#2563EB"/>
  <text x="297" y="452" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500" fill="#DC2626">Ct ≈ 16</text>
  <text x="383" y="452" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500" fill="#D97706">Ct ≈ 22</text>
  <text x="469" y="452" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500" fill="#2563EB">Ct ≈ 28</text>

  <!-- ticks -->
  <text x="70" y="436" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748B">0</text>
  <text x="212.5" y="436" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748B">10</text>
  <text x="355" y="436" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748B">20</text>
  <text x="497.5" y="436" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748B">30</text>
  <text x="640" y="436" text-anchor="end" font-family="sans-serif" font-size="11" fill="#64748B">40</text>

  <!-- axis titles -->
  <text x="70" y="44" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">荧光信号强度</text>
  <text x="355" y="474" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">循环数（Cycles）</text>

  <!-- legend -->
  <rect x="90" y="100" width="148" height="92" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="102" y1="120" x2="128" y2="120" stroke="#DC2626" stroke-width="2.5"/>
  <text x="136" y="124" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#334155">模板量高</text>
  <line x1="102" y1="146" x2="128" y2="146" stroke="#D97706" stroke-width="2.5"/>
  <text x="136" y="150" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#334155">模板量中</text>
  <line x1="102" y1="172" x2="128" y2="172" stroke="#2563EB" stroke-width="2.5"/>
  <text x="136" y="176" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#334155">模板量低</text>

  <!-- footnote -->
  <text x="340" y="502" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#334155">Ct 值 = 荧光信号首次超过阈值的循环数；起始模板越多，Ct 越小</text>
</svg>
